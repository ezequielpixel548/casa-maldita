<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>La Casa Maldita</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #000; overflow: hidden;
    font-family: 'Courier New', monospace;
    color: #c9c2b8;
  }
  #game { position: relative; width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; }
  canvas { background: #000; display: block; max-width: 100vw; max-height: 100vh; image-rendering: pixelated; }

  /* --- Pantallas overlay --- */
  .screen {
    position: absolute; inset: 0; background: rgba(3,2,2,0.96);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 24px; z-index: 50;
  }
  .hidden { display: none !important; }
  h1 { font-size: 2.4em; color: #8a1414; text-shadow: 0 0 18px #8a1414, 0 0 40px #400; letter-spacing: 4px; margin-bottom: 6px; }
  h1 span { color: #c9c2b8; text-shadow:none; font-size:0.4em; display:block; letter-spacing:2px; margin-top:6px;}
  .subtitle { color: #776f66; margin-bottom: 30px; font-size: 0.9em; }
  button {
    background: #1a1414; color: #c9c2b8; border: 1px solid #5a2020;
    padding: 14px 28px; font-family: inherit; font-size: 1em; letter-spacing: 2px;
    cursor: pointer; margin: 6px; border-radius: 3px; transition: all .15s;
  }
  button:hover, button:active { background: #5a2020; color: #fff; }
  button:disabled { opacity: 0.3; cursor: default; }
  .small { font-size: 0.75em; color: #665f57; max-width: 480px; line-height: 1.6; margin-top: 20px;}

  /* --- HUD --- */
  #hud {
    position: absolute; top: 0; left: 0; right: 0; padding: 10px 14px;
    display: flex; justify-content: space-between; align-items: flex-start;
    pointer-events: none; z-index: 10; font-size: 0.8em;
  }
  #roomName { color: #7a736a; letter-spacing: 2px; text-transform: uppercase; text-shadow: 0 0 6px #000;}
  #saveIndicator { color: #4a5a3a; opacity: 0; transition: opacity .4s; text-shadow: 0 0 6px #000;}
  #saveIndicator.show { opacity: 1; }
  #muteBtn { pointer-events: auto; background: rgba(0,0,0,0.4); border: 1px solid #333; color: #776f66; padding: 6px 10px; font-size: 0.9em; }

  #prompt {
    position: absolute; bottom: 130px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,0.75); border: 1px solid #444; padding: 8px 16px;
    border-radius: 4px; font-size: 0.85em; color: #d4cfc4; z-index: 10;
    opacity: 0; transition: opacity .15s; pointer-events: none; white-space: nowrap;
  }
  #prompt.show { opacity: 1; }

  #message {
    position: absolute; top: 46%; left: 50%; transform: translate(-50%,-50%);
    background: rgba(0,0,0,0.85); border: 1px solid #5a2020; padding: 14px 22px;
    border-radius: 4px; color: #d4a5a5; font-size: 0.9em; z-index: 20;
    opacity: 0; transition: opacity .25s; pointer-events: none; max-width: 80vw; text-align:center;
  }
  #message.show { opacity: 1; }

  /* --- Inventario --- */
  #inventory {
    position: absolute; bottom: 0; left: 0; right: 0; padding: 10px;
    display: flex; gap: 8px; justify-content: center; z-index: 10;
    background: linear-gradient(to top, rgba(0,0,0,0.6), transparent);
  }
  .item {
    width: 46px; height: 46px; background: rgba(20,15,15,0.8); border: 1px solid #443;
    border-radius: 4px; display: flex; align-items: center; justify-content: center;
    font-size: 1.4em; pointer-events: auto; position: relative;
  }
  .item.empty { border: 1px dashed #2a2a2a; opacity: 0.4; }

  /* --- Controles táctiles --- */
  #touchControls {
    position: absolute; bottom: 70px; left: 0; right: 0; display: flex;
    justify-content: space-between; padding: 0 16px; z-index: 10; pointer-events: none;
  }
  #dpad { display: grid; grid-template-columns: repeat(3, 44px); grid-template-rows: repeat(3, 44px); gap: 3px; pointer-events: auto; }
  #dpad button { margin: 0; padding: 0; width: 44px; height: 44px; font-size: 1.1em; background: rgba(20,15,15,0.55); border: 1px solid #443; }
  #dpad .u{grid-area:1/2;} #dpad .l{grid-area:2/1;} #dpad .d{grid-area:3/2;} #dpad .r{grid-area:2/3;}
  #actionBtn { pointer-events: auto; align-self: flex-end; width: 68px; height: 68px; border-radius: 50%;
    background: rgba(90,32,32,0.5); border: 1px solid #7a2828; font-size: 0.75em; }

  /* --- Modal de acertijos --- */
  #puzzleModal {
    position: absolute; inset: 0; background: rgba(0,0,0,0.92); z-index: 40;
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .puzzleBox {
    background: #0d0a0a; border: 1px solid #5a2020; border-radius: 6px; padding: 24px;
    max-width: 440px; width: 100%; text-align: center;
  }
  .puzzleBox h3 { color: #b06a6a; margin-top: 0; letter-spacing: 1px; }
  .puzzleBox p { font-size: 0.9em; line-height: 1.6; color: #b5afa6; }
  .puzzleBox input {
    background: #1a1414; border: 1px solid #5a2020; color: #d4cfc4; padding: 10px;
    font-family: inherit; font-size: 1.1em; text-align: center; width: 140px; letter-spacing: 4px;
    margin: 10px 0; border-radius: 3px;
  }
  .seqGrid { display: grid; grid-template-columns: repeat(2, 70px); gap: 10px; justify-content: center; margin: 16px 0; }
  .seqBtn { width: 70px; height: 70px; font-size: 1.6em; opacity: 0.55; }
  .seqBtn.lit { opacity: 1; background: #7a2828 !important; box-shadow: 0 0 20px #7a2828; }
  .puzzleFeedback { min-height: 20px; color: #d4a5a5; font-size: 0.85em; margin-top: 6px; }

  #flash {
    position: absolute; inset: 0; background: #fff; z-index: 60; opacity: 0; pointer-events: none;
  }
</style>
</head>
<body>
<div id="game">
  <canvas id="canvas" width="800" height="500"></canvas>

  <div id="hud">
    <div id="roomName">Entrada</div>
    <div style="display:flex; align-items:center; gap:10px;">
      <div id="saveIndicator">● guardado</div>
      <button id="muteBtn">🔊</button>
    </div>
  </div>

  <div id="prompt"></div>
  <div id="message"></div>

  <div id="inventory"></div>

  <div id="touchControls">
    <div id="dpad">
      <button class="u" data-k="up">▲</button>
      <button class="l" data-k="left">◀</button>
      <button class="d" data-k="down">▼</button>
      <button class="r" data-k="right">▶</button>
    </div>
    <button id="actionBtn">E</button>
  </div>

  <!-- Pantalla de inicio -->
  <div id="startScreen" class="screen">
    <h1>LA CASA MALDITA<span>un juego de acertijos y terror</span></h1>
    <div class="subtitle">WASD / Flechas para moverte · E para interactuar</div>
    <button id="btnNewGame">Nueva Partida</button>
    <button id="btnContinue" class="hidden">Continuar</button>
    <div class="small">Explora la casa, resuelve los acertijos, encuentra las llaves y decide tu destino. El sonido mejora la experiencia — actívalo si puedes.</div>
  </div>

  <!-- Pantalla de final -->
  <div id="endScreen" class="screen hidden">
    <h1 id="endTitle">FIN</h1>
    <p id="endText" class="small" style="font-size:0.95em; color:#b5afa6;"></p>
    <button id="btnRestart">Jugar de nuevo</button>
  </div>

  <!-- Modal de acertijos -->
  <div id="puzzleModal" class="hidden">
    <div class="puzzleBox" id="puzzleBox"></div>
  </div>

  <div id="flash"></div>
</div>

<script>
(function(){
"use strict";

/* ==========================================================
   AUDIO — todo generado por código, sin archivos externos
   ========================================================== */
let actx = null, masterGain = null, muted = false, droneNodes = null;
function initAudio(){
  if (actx) return;
  actx = new (window.AudioContext || window.webkitAudioContext)();
  masterGain = actx.createGain();
  masterGain.gain.value = 0.5;
  masterGain.connect(actx.destination);
  startDrone();
  scheduleCreak();
}
function startDrone(){
  const osc1 = actx.createOscillator();
  const osc2 = actx.createOscillator();
  osc1.type = 'sine'; osc1.frequency.value = 45;
  osc2.type = 'sine'; osc2.frequency.value = 46.5;
  const g = actx.createGain(); g.gain.value = 0.06;
  const lfo = actx.createOscillator(); lfo.frequency.value = 0.07;
  const lfoGain = actx.createGain(); lfoGain.gain.value = 0.03;
  lfo.connect(lfoGain); lfoGain.connect(g.gain);
  osc1.connect(g); osc2.connect(g); g.connect(masterGain);
  osc1.start(); osc2.start(); lfo.start();
  droneNodes = {osc1,osc2,lfo,g};
}
function noiseBuffer(duration){
  const rate = actx.sampleRate;
  const buf = actx.createBuffer(1, rate*duration, rate);
  const d = buf.getChannelData(0);
  for (let i=0;i<d.length;i++) d[i] = (Math.random()*2-1) * Math.pow(1 - i/d.length, 2);
  return buf;
}
function playCreak(vol){
  if (!actx || muted) return;
  const src = actx.createBufferSource();
  src.buffer = noiseBuffer(0.4 + Math.random()*0.6);
  const filt = actx.createBiquadFilter();
  filt.type = 'bandpass';
  filt.frequency.value = 200 + Math.random()*400;
  filt.Q.value = 4;
  const g = actx.createGain();
  g.gain.value = vol || 0.15;
  src.connect(filt); filt.connect(g); g.connect(masterGain);
  src.start();
}
function scheduleCreak(){
  playCreak(0.08 + Math.random()*0.08);
  setTimeout(scheduleCreak, 6000 + Math.random()*9000);
}
function playTone(freq, dur, type, vol){
  if (!actx || muted) return;
  const o = actx.createOscillator();
  const g = actx.createGain();
  o.type = type || 'sine'; o.frequency.value = freq;
  g.gain.value = vol || 0.2;
  g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + dur);
  o.connect(g); g.connect(masterGain);
  o.start(); o.stop(actx.currentTime + dur);
}
function playStep(){ if(!actx||muted) return; playCreak(0.03); }
function playUnlock(){ playTone(220,0.15,'square',0.15); setTimeout(()=>playTone(330,0.2,'square',0.15),120); }
function playPickup(){ playTone(500,0.1,'sine',0.15); setTimeout(()=>playTone(750,0.15,'sine',0.15),80); }
function playError(){ playTone(90,0.3,'sawtooth',0.2); }
function playSuccess(){ playTone(400,0.1,'sine',0.2); setTimeout(()=>playTone(600,0.1,'sine',0.2),90); setTimeout(()=>playTone(900,0.2,'sine',0.2),180); }
function playJumpscare(){
  if (!actx || muted) return;
  const src = actx.createBufferSource();
  src.buffer = noiseBuffer(0.6);
  const g = actx.createGain(); g.gain.value = 0.5;
  src.connect(g); g.connect(masterGain);
  src.start();
  playTone(60,0.8,'sawtooth',0.3);
  flashScreen();
}
function flashScreen(){
  const f = document.getElementById('flash');
  f.style.transition = 'none'; f.style.opacity = '0.85';
  requestAnimationFrame(()=>{ f.style.transition='opacity .5s'; f.style.opacity='0'; });
}

/* ==========================================================
   DATOS DEL MUNDO
   ========================================================== */
const W = 800, H = 500;

const ROOMS = {
  entrada: {
    name: "Entrada",
    bg: "#151013",
    doors: [
      { id:"d_entrada_sala", x: W-14, y: H/2-45, w:14, h:90, to:"sala", toX: 40, toY: H/2, locked:true, key:"llave_cobre" }
    ],
    objects: [
      { id:"cuadro", x: 340, y: 120, w: 60, h: 80, color:"#3a2a20", label:"🖼", name:"cuadro viejo", type:"riddle" }
    ]
  },
  sala: {
    name: "Sala de Estar",
    bg: "#141216",
    doors: [
      { id:"d_sala_entrada", x: 0, y: H/2-45, w:14, h:90, to:"entrada", toX: W-40, toY: H/2, locked:false },
      { id:"d_sala_cocina",  x: W-14, y: H/2-45, w:14, h:90, to:"cocina", toX: 40, toY: H/2, locked:false },
      { id:"d_sala_biblio",  x: W/2-45, y: 0, w:90, h:14, to:"biblioteca", toX: W/2, toY: H-40, locked:true, key:"llave_hierro" }
    ],
    objects: [
      { id:"estanteria", x: 120, y: 200, w: 70, h: 100, color:"#2a2016", label:"📚", name:"estantería", type:"sequence" },
      { id:"papel", x: 560, y: 340, w: 40, h: 30, color:"#3a3428", label:"📄", name:"papel arrugado", type:"note",
        text:"Un papel con una fecha garabateada una y otra vez: «14 - 28». Parece importante." }
    ]
  },
  cocina: {
    name: "Cocina",
    bg: "#111213",
    doors: [
      { id:"d_cocina_sala",   x: 0, y: H/2-45, w:14, h:90, to:"sala", toX: W-40, toY: H/2, locked:false },
      { id:"d_cocina_sotano", x: W/2-45, y: H-14, w:90, h:14, to:"sotano", toX: W/2, toY: 40, locked:true, key:"llave_plata" }
    ],
    objects: [
      { id:"cajones", x: 400, y: 150, w: 90, h: 60, color:"#332a20", label:"🗄", name:"cajones cerrados", type:"code" }
    ]
  },
  biblioteca: {
    name: "Biblioteca",
    bg: "#100e12",
    doors: [
      { id:"d_biblio_sala", x: W/2-45, y: H-14, w:90, h:14, to:"sala", toX: W/2, toY: 40, locked:false }
    ],
    objects: [
      { id:"libro_antiguo", x: 380, y: 160, w: 50, h: 40, color:"#241a30", label:"📖", name:"libro antiguo", type:"amulet" }
    ]
  },
  sotano: {
    name: "El Sótano",
    bg: "#0a0808",
    doors: [],
    objects: [
      { id:"altar", x: 200, y: 200, w: 80, h: 60, color:"#3a1010", label:"🕯", name:"altar de piedra", type:"altar" },
      { id:"puerta_salida", x: 560, y: 200, w: 60, h: 90, color:"#2a2418", label:"🚪", name:"puerta de salida", type:"exit" }
    ]
  }
};

const RIDDLE = {
  question: "«Tiene ciudades, pero no casas; bosques, pero no árboles; y agua, pero no peces. ¿Qué es?»",
  answers: ["mapa","un mapa","el mapa"]
};

const SEQUENCE = { icons: ["🔺","🔵","⬛","🔶"], length: 5 };

const CODE_ANSWER = "1428";

/* ==========================================================
   ESTADO DEL JUEGO
   ========================================================== */
let state = null;
function freshState(){
  return {
    room: "entrada",
    px: 60, py: H/2,
    inventory: [],
    flags: {
      d_entrada_sala:false, d_sala_biblio:false, d_cocina_sotano:false,
      cuadro:false, estanteria:false, cajones:false, libro_antiguo:false, altar:false
    }
  };
}

const SAVE_KEY = "casa_maldita_save_v1";
function saveGame(){
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify(state));
    showSaveIndicator();
  } catch(e){ /* almacenamiento no disponible */ }
}
function loadGame(){
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return null;
    return JSON.parse(raw);
  } catch(e){ return null; }
}
function clearSave(){
  try { localStorage.removeItem(SAVE_KEY); } catch(e){}
}
let saveTimeout = null;
function showSaveIndicator(){
  const el = document.getElementById('saveIndicator');
  el.classList.add('show');
  clearTimeout(saveTimeout);
  saveTimeout = setTimeout(()=> el.classList.remove('show'), 1200);
}

/* ==========================================================
   ITEMS
   ========================================================== */
const ITEM_ICONS = {
  llave_cobre: "🔑", llave_hierro: "🗝", llave_plata: "🔐", amuleto: "🧿"
};
const ITEM_NAMES = {
  llave_cobre: "Llave de cobre", llave_hierro: "Llave de hierro", llave_plata: "Llave de plata", amuleto: "Amuleto antiguo"
};
function giveItem(id){
  if (!state.inventory.includes(id)) state.inventory.push(id);
  renderInventory();
  playPickup();
  showMessage("Has obtenido: " + ITEM_NAMES[id]);
  saveGame();
}
function hasItem(id){ return state.inventory.includes(id); }

function renderInventory(){
  const box = document.getElementById('inventory');
  box.innerHTML = "";
  const slots = 6;
  for (let i=0;i<slots;i++){
    const div = document.createElement('div');
    const id = state.inventory[i];
    if (id){
      div.className = "item";
      div.innerHTML = ITEM_ICONS[id] || "❔";
      div.title = ITEM_NAMES[id] || id;
    } else {
      div.className = "item empty";
    }
    box.appendChild(div);
  }
}

/* ==========================================================
   INPUT
   ========================================================== */
const keys = { up:false, down:false, left:false, right:false };
window.addEventListener('keydown', e=>{
  if (['ArrowUp','w','W'].includes(e.key)) keys.up = true;
  if (['ArrowDown','s','S'].includes(e.key)) keys.down = true;
  if (['ArrowLeft','a','A'].includes(e.key)) keys.left = true;
  if (['ArrowRight','d','D'].includes(e.key)) keys.right = true;
  if (e.key === 'e' || e.key === 'E') tryInteract();
});
window.addEventListener('keyup', e=>{
  if (['ArrowUp','w','W'].includes(e.key)) keys.up = false;
  if (['ArrowDown','s','S'].includes(e.key)) keys.down = false;
  if (['ArrowLeft','a','A'].includes(e.key)) keys.left = false;
  if (['ArrowRight','d','D'].includes(e.key)) keys.right = false;
});
document.querySelectorAll('#dpad button').forEach(btn=>{
  const k = btn.dataset.k;
  const set = v => e => { e.preventDefault(); keys[k] = v; };
  btn.addEventListener('touchstart', set(true), {passive:false});
  btn.addEventListener('touchend', set(false), {passive:false});
  btn.addEventListener('mousedown', set(true));
  btn.addEventListener('mouseup', set(false));
  btn.addEventListener('mouseleave', set(false));
});
document.getElementById('actionBtn').addEventListener('click', tryInteract);

/* ==========================================================
   LÓGICA DE JUEGO
   ========================================================== */
const PLAYER_R = 12;
const SPEED = 2.6;
let stepAccum = 0;
let currentTarget = null; // objeto o puerta cercana

function update(){
  if (!state || puzzleOpen || ended) return;
  let dx=0, dy=0;
  if (keys.up) dy -= 1;
  if (keys.down) dy += 1;
  if (keys.left) dx -= 1;
  if (keys.right) dx += 1;
  if (dx || dy){
    const len = Math.hypot(dx,dy);
    dx = dx/len*SPEED; dy = dy/len*SPEED;
    const nx = clamp(state.px+dx, PLAYER_R+6, W-PLAYER_R-6);
    const ny = clamp(state.py+dy, PLAYER_R+6, H-PLAYER_R-6);

    // comprobar colisión con puertas cerradas (bloquean) y permitir pasar por abiertas
    const room = ROOMS[state.room];
    let blocked = false;
    for (const door of room.doors){
      if (rectsOverlapCircle(nx,ny,PLAYER_R, door)){
        if (isDoorLocked(door)){
          blocked = true;
        } else {
          // transición de sala
          goToRoom(door.to, door.toX, door.toY);
          return;
        }
      }
    }
    if (!blocked){
      state.px = nx; state.py = ny;
      stepAccum += Math.hypot(dx,dy);
      if (stepAccum > 34){ stepAccum = 0; playStep(); }
    }
  }
  updatePrompt();
}

function clamp(v,min,max){ return Math.max(min, Math.min(max, v)); }
function rectsOverlapCircle(cx,cy,r,rect){
  const closestX = clamp(cx, rect.x, rect.x+rect.w);
  const closestY = clamp(cy, rect.y, rect.y+rect.h);
  const dx = cx-closestX, dy = cy-closestY;
  return (dx*dx+dy*dy) < r*r;
}
function isDoorLocked(door){
  if (!door.locked) return false;
  if (state.flags[door.id]) return false; // ya desbloqueada permanentemente
  return true;
}

function goToRoom(roomId, x, y){
  state.room = roomId;
  state.px = x; state.py = y;
  document.getElementById('roomName').textContent = ROOMS[roomId].name;
  saveGame();
  if (roomId === "sotano") playCreak(0.25);
}

function nearestTarget(){
  const room = ROOMS[state.room];
  let best = null, bestDist = 60;
  for (const obj of room.objects){
    const cx = obj.x+obj.w/2, cy = obj.y+obj.h/2;
    const d = Math.hypot(state.px-cx, state.py-cy);
    if (d < bestDist){ bestDist = d; best = {kind:"object", ref:obj}; }
  }
  for (const door of room.doors){
    if (!isDoorLocked(door)) continue;
    const cx = door.x+door.w/2, cy = door.y+door.h/2;
    const d = Math.hypot(state.px-cx, state.py-cy);
    if (d < bestDist){ bestDist = d; best = {kind:"door", ref:door}; }
  }
  return best;
}

function updatePrompt(){
  currentTarget = nearestTarget();
  const el = document.getElementById('prompt');
  if (currentTarget){
    let label;
    if (currentTarget.kind === "object") label = "Examinar " + currentTarget.ref.name;
    else label = "Puerta cerrada — necesitas: " + ITEM_NAMES[currentTarget.ref.key];
    el.textContent = "[E] " + label;
    el.classList.add('show');
  } else {
    el.classList.remove('show');
  }
}

function tryInteract(){
  if (puzzleOpen || ended || !currentTarget) return;
  if (currentTarget.kind === "door"){
    const door = currentTarget.ref;
    if (hasItem(door.key)){
      state.flags[door.id] = true;
      playUnlock();
      showMessage("Usas " + ITEM_NAMES[door.key] + ". La puerta se abre.");
      saveGame();
    } else {
      playError();
      showMessage("Está cerrada con llave.");
    }
    return;
  }
  handleObject(currentTarget.ref);
}

function handleObject(obj){
  switch(obj.type){
    case "note":
      showMessage(obj.text, 4200);
      break;
    case "riddle":
      if (state.flags.cuadro){ showMessage("Detrás del cuadro ya no hay nada."); return; }
      openRiddlePuzzle(()=>{
        state.flags.cuadro = true;
        giveItem("llave_cobre");
      });
      break;
    case "sequence":
      if (state.flags.estanteria){ showMessage("La estantería ya no oculta nada."); return; }
      openSequencePuzzle(()=>{
        state.flags.estanteria = true;
        giveItem("llave_hierro");
      });
      break;
    case "code":
      if (state.flags.cajones){ showMessage("Los cajones ya están vacíos."); return; }
      openCodePuzzle(()=>{
        state.flags.cajones = true;
        giveItem("llave_plata");
      });
      break;
    case "amulet":
      if (state.flags.libro_antiguo){ showMessage("Ya leíste este libro."); return; }
      state.flags.libro_antiguo = true;
      showMessage("Entre las páginas encuentras un amuleto grabado con símbolos extraños.", 3600);
      giveItem("amuleto");
      break;
    case "altar":
      state.flags.altar = true;
      saveGame();
      endGame("malo");
      break;
    case "exit":
      if (hasItem("amuleto")) endGame("secreto");
      else endGame("bueno");
      break;
  }
}

/* ==========================================================
   MENSAJES
   ========================================================== */
let msgTimeout = null;
function showMessage(text, duration){
  const el = document.getElementById('message');
  el.textContent = text;
  el.classList.add('show');
  clearTimeout(msgTimeout);
  msgTimeout = setTimeout(()=> el.classList.remove('show'), duration || 2600);
}

/* ==========================================================
   ACERTIJOS
   ========================================================== */
let puzzleOpen = false;

function openPuzzle(html){
  puzzleOpen = true;
  document.getElementById('puzzleModal').classList.remove('hidden');
  document.getElementById('puzzleBox').innerHTML = html;
}
function closePuzzle(){
  puzzleOpen = false;
  document.getElementById('puzzleModal').classList.add('hidden');
}

function openRiddlePuzzle(onSolved){
  openPuzzle(`
    <h3>Un susurro tras el lienzo</h3>
    <p>${RIDDLE.question}</p>
    <input type="text" id="riddleInput" placeholder="tu respuesta" autocomplete="off">
    <div class="puzzleFeedback" id="riddleFeedback"></div>
    <div>
      <button id="riddleSubmit">Responder</button>
      <button id="riddleCancel">Salir</button>
    </div>
  `);
  const input = document.getElementById('riddleInput');
  input.focus();
  const submit = ()=>{
    const val = input.value.trim().toLowerCase();
    if (RIDDLE.answers.includes(val)){
      playSuccess();
      document.getElementById('riddleFeedback').textContent = "El marco cruje y algo cae detrás del cuadro.";
      setTimeout(()=>{ closePuzzle(); onSolved(); }, 900);
    } else {
      playError();
      document.getElementById('riddleFeedback').textContent = "No es correcto...";
    }
  };
  document.getElementById('riddleSubmit').onclick = submit;
  input.addEventListener('keydown', e=>{ if (e.key === 'Enter') submit(); });
  document.getElementById('riddleCancel').onclick = closePuzzle;
}

function openCodePuzzle(onSolved){
  openPuzzle(`
    <h3>Cajones con cerradura numérica</h3>
    <p>Un candado de cuatro dígitos. Recuerdas un papel con «14 - 28» escrito una y otra vez.</p>
    <input type="text" id="codeInput" inputmode="numeric" maxlength="4" placeholder="0000" autocomplete="off">
    <div class="puzzleFeedback" id="codeFeedback"></div>
    <div>
      <button id="codeSubmit">Introducir</button>
      <button id="codeCancel">Salir</button>
    </div>
  `);
  const input = document.getElementById('codeInput');
  input.focus();
  const submit = ()=>{
    if (input.value.trim() === CODE_ANSWER){
      playSuccess();
      document.getElementById('codeFeedback').textContent = "Clic. El cajón se abre.";
      setTimeout(()=>{ closePuzzle(); onSolved(); }, 800);
    } else {
      playError();
      document.getElementById('codeFeedback').textContent = "El candado no cede.";
    }
  };
  document.getElementById('codeSubmit').onclick = submit;
  input.addEventListener('keydown', e=>{ if (e.key === 'Enter') submit(); });
  document.getElementById('codeCancel').onclick = closePuzzle;
}

function openSequencePuzzle(onSolved){
  const icons = SEQUENCE.icons;
  const sequence = [];
  for (let i=0;i<SEQUENCE.length;i++) sequence.push(Math.floor(Math.random()*icons.length));
  openPuzzle(`
    <h3>Libros fuera de lugar</h3>
    <p>Observa el orden en que brillan los símbolos y repítelo.</p>
    <div class="seqGrid" id="seqGrid">
      ${icons.map((ic,i)=>`<button class="seqBtn" data-i="${i}">${ic}</button>`).join("")}
    </div>
    <div class="puzzleFeedback" id="seqFeedback">Observa...</div>
    <button id="seqCancel">Salir</button>
  `);
  const buttons = Array.from(document.querySelectorAll('.seqBtn'));
  buttons.forEach(b => b.disabled = true);
  document.getElementById('seqCancel').onclick = closePuzzle;

  let playerStep = 0;
  function playback(i){
    if (i >= sequence.length){
      document.getElementById('seqFeedback').textContent = "Ahora repite la secuencia.";
      buttons.forEach(b => b.disabled = false);
      return;
    }
    const idx = sequence[i];
    buttons[idx].classList.add('lit');
    playTone(300 + idx*90, 0.25, 'sine', 0.15);
    setTimeout(()=>{
      buttons[idx].classList.remove('lit');
      setTimeout(()=> playback(i+1), 220);
    }, 380);
  }
  setTimeout(()=> playback(0), 500);

  buttons.forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if (btn.disabled) return;
      const idx = parseInt(btn.dataset.i);
      btn.classList.add('lit');
      playTone(300+idx*90,0.15,'sine',0.15);
      setTimeout(()=> btn.classList.remove('lit'), 200);
      if (idx === sequence[playerStep]){
        playerStep++;
        if (playerStep === sequence.length){
          playSuccess();
          document.getElementById('seqFeedback').textContent = "¡Correcto! Un libro se desliza revelando algo.";
          buttons.forEach(b => b.disabled = true);
          setTimeout(()=>{ closePuzzle(); onSolved(); }, 900);
        }
      } else {
        playError();
        document.getElementById('seqFeedback').textContent = "Secuencia incorrecta. Observa de nuevo...";
        playerStep = 0;
        buttons.forEach(b => b.disabled = true);
        setTimeout(()=> playback(0), 900);
      }
    });
  });
}

  }, type === "malo" ? 700 : 200);
}

/* ==========================================================
   RENDER
   ========================================================== */
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

function draw(){
  if (!state) { requestAnimationFrame(draw); return; }
  const room = ROOMS[state.room];
  ctx.fillStyle = room.bg;
  ctx.fillRect(0,0,W,H);

  // suelo con textura simple
  ctx.strokeStyle = "rgba(255,255,255,0.02)";
  for (let x=0;x<W;x+=40){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
  for (let y=0;y<H;y+=40){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }

  // paredes (borde)
  ctx.strokeStyle = "#000";
  ctx.lineWidth = 12;
  ctx.strokeRect(6,6,W-12,H-12);

  // puertas
  for (const door of room.doors){
    const locked = isDoorLocked(door);
    ctx.fillStyle = locked ? "#3a1414" : "#2a3a2a";
    ctx.fillRect(door.x, door.y, door.w, door.h);
    ctx.strokeStyle = locked ? "#6a2020" : "#3a5a3a";
    ctx.lineWidth = 2;
    ctx.strokeRect(door.x, door.y, door.w, door.h);
    if (locked){
      ctx.fillStyle = "#c9a0a0"; ctx.font = "16px monospace"; ctx.textAlign = "center";
      ctx.fillText("🔒", door.x+door.w/2, door.y+door.h/2+6);
    }
  }

  // objetos
  for (const obj of room.objects){
    ctx.fillStyle = obj.color;
    ctx.fillRect(obj.x, obj.y, obj.w, obj.h);
    ctx.strokeStyle = "rgba(255,255,255,0.08)";
    ctx.strokeRect(obj.x, obj.y, obj.w, obj.h);
    ctx.font = "22px sans-serif"; ctx.textAlign = "center";
    ctx.fillText(obj.label, obj.x+obj.w/2, obj.y+obj.h/2+8);
  }

  // jugador
  ctx.beginPath();
  ctx.arc(state.px, state.py, PLAYER_R, 0, Math.PI*2);
  ctx.fillStyle = "#d8cbb0";
  ctx.fill();
  ctx.strokeStyle = "#000"; ctx.lineWidth = 2; ctx.stroke();

  // --- oscuridad / linterna ---
  const grd = ctx.createRadialGradient(state.px, state.py, 30, state.px, state.py, 230);
  grd.addColorStop(0, "rgba(0,0,0,0)");
  grd.addColorStop(0.55, "rgba(0,0,0,0.55)");
  grd.addColorStop(1, "rgba(0,0,0,0.94)");
  ctx.fillStyle = grd;
  ctx.fillRect(0,0,W,H);

  // viñeta extra
  const vgn = ctx.createRadialGradient(W/2,H/2, H/2*0.6, W/2,H/2, H/1.1);
  vgn.addColorStop(0, "rgba(0,0,0,0)");
  vgn.addColorStop(1, "rgba(0,0,0,0.6)");
  ctx.fillStyle = vgn;
  ctx.fillRect(0,0,W,H);

  requestAnimationFrame(draw);
}

function loop(){
  update();
  setTimeout(loop, 1000/60);
}

/* ==========================================================
   INICIO / CONTROL DE PANTALLAS
   ========================================================== */
document.getElementById('muteBtn').addEventListener('click', ()=>{
  muted = !muted;
  document.getElementById('muteBtn').textContent = muted ? "🔇" : "🔊";
  if (masterGain) masterGain.gain.value = muted ? 0 : 0.5;
});

function startGame(loaded){
  document.getElementById('startScreen').classList.add('hidden');
  state = loaded || freshState();
  ended = false;
  document.getElementById('roomName').textContent = ROOMS[state.room].name;
  renderInventory();
  initAudio();
  if (actx && actx.state === 'suspended') actx.resume();
  loop();
  draw();
}

document.getElementById('btnNewGame').addEventListener('click', ()=>{
  clearSave();
  startGame(null);
});
document.getElementById('btnContinue').addEventListener('click', ()=>{
  startGame(loadGame());
});
document.getElementById('btnRestart').addEventListener('click', ()=>{
  document.getElementById('endScreen').classList.add('hidden');
  document.getElementById('startScreen').classList.remove('hidden');
  document.getElementById('btnContinue').classList.add('hidden');
});

const existing = loadGame();
if (existing) document.getElementById('btnContinue').classList.remove('hidden');

requestAnimationFrame(draw);
})();
